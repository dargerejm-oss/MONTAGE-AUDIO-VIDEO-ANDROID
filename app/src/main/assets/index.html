<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MONTAGE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#232a31;color:#eceff1;font-family:system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
#top{flex:0 0 auto;background:#1b2127;padding:6px 8px 4px}
#pvwrap{position:relative;margin:0 auto;background:#000;border-radius:10px;overflow:hidden;max-height:34vh;aspect-ratio:16/9;width:100%}
#pvwrap video,#pvwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#pvwrap img{display:none}
#fadev{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#tov{position:absolute;left:0;right:0;text-align:center;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none;padding:0 6px}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#78909c;font-size:15px;text-align:center;padding:10px}
#tr{display:flex;align-items:center;gap:8px;margin-top:6px}
#tr button{flex:0 0 52px;height:44px;border:0;border-radius:12px;background:#43a047;color:#fff;font-size:22px;font-weight:800}
#sl{flex:1;height:34px}
#tm{flex:0 0 auto;font-size:13px;font-variant-numeric:tabular-nums;color:#b0bec5;min-width:84px;text-align:right}
#pane{flex:1 1 auto;overflow-y:auto;padding:10px 10px 16px;-webkit-overflow-scrolling:touch}
#tabs{flex:0 0 auto;display:flex;gap:4px;padding:5px;background:#10151a}
#tabs button{flex:1;height:58px;border:0;border-radius:12px;color:#fff;font-weight:800;font-size:12px;opacity:.55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#tabs button b{font-size:20px;line-height:1}
#tabs button.on{opacity:1;box-shadow:0 0 0 3px rgba(255,255,255,.55) inset}
.t0{background:#ef6c00}.t1{background:#1e88e5}.t2{background:#8e24aa}.t3{background:#43a047}.t4{background:#e53935}
.card{background:#2c353d;border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px;color:#cfd8dc}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 14px;border:0;border-radius:12px;background:#455a64;color:#fff;font-size:15px;font-weight:700}
.btn.big{width:100%;min-height:60px;font-size:18px}
.btn.o{background:#ef6c00}.btn.b{background:#1e88e5}.btn.p{background:#8e24aa}.btn.g{background:#43a047}.btn.r{background:#e53935}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.row>.btn{flex:1}
label.f{display:block;margin:10px 0 2px;font-size:13px;color:#b0bec5}
label.f span{float:right;color:#fff;font-weight:700}
input[type=range]{width:100%;height:34px}
select,input[type=text]{width:100%;height:46px;border-radius:10px;border:0;background:#37474f;color:#fff;font-size:16px;padding:0 10px}
#strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
.ch{flex:0 0 86px;border-radius:10px;background:#37474f;overflow:hidden;border:3px solid transparent;position:relative}
.ch.sel{border-color:#1e88e5}
.ch img{width:100%;height:52px;object-fit:cover;display:block;background:#000}
.ch small{display:block;text-align:center;font-size:11px;padding:2px 0;color:#cfd8dc}
.ch i{position:absolute;top:2px;left:3px;font-style:normal;font-size:11px;font-weight:800;background:rgba(0,0,0,.6);border-radius:6px;padding:0 4px}
.hint{color:#90a4ae;font-size:13px;margin:4px 0}
.item{display:flex;align-items:center;gap:8px;background:#37474f;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
.item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item button{flex:0 0 40px;height:40px;border:0;border-radius:10px;background:#e53935;color:#fff;font-size:18px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#modal .box{background:#2c353d;border-radius:18px;padding:18px;width:100%;max-width:420px;text-align:center}
#modal h2{margin:0 0 8px;font-size:26px}
#modal.ok h2{color:#66bb6a}#modal.err h2{color:#ef5350}
.banner{margin:10px 0 4px;border-radius:12px;padding:14px;text-align:center;font-size:24px;font-weight:900;background:#455a64;color:#fff;letter-spacing:1px}
.banner.run{background:#1e88e5}.banner.done{background:#2e7d32;font-size:34px}.banner.err{background:#c62828}.banner.stop{background:#ef6c00}
.msg{text-align:center;color:#b0bec5;font-size:13px;min-height:18px}
.clocks{display:flex;gap:14px;font-weight:700}
.bar{height:20px;background:#37474f;border-radius:10px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e53935,#fb8c00,#fdd835,#43a047);transition:width .4s}
.hgw{display:flex;align-items:center;gap:14px;margin:6px 4px 2px}
.hgw svg{flex:0 0 132px;width:132px;height:194px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.hgr{flex:1;min-width:0}
.hgp{font-size:44px;font-weight:900;line-height:1;transition:color .4s}
.hgr .clocks{flex-direction:column;gap:6px;margin:10px 0 0;font-size:17px}
.hgs{stroke-dasharray:3 4;animation:hgfall .35s linear infinite}
@keyframes hgfall{to{stroke-dashoffset:-7}}
.hgflip.fin{animation:hgwob 1s ease-in-out 2}
@keyframes hgwob{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}}

</style></head><body>
<div id="top">
 <div id="pvwrap"><video id="pv" playsinline></video><img id="pi" alt=""><div id="fadev"></div><div id="tov"></div><div id="empty">Ajoute des photos et vidéos dans l'onglet MÉDIAS</div></div>
 <div id="tr"><button id="bplay" onclick="togglePlay()">▶</button><input id="sl" type="range" min="0" max="0" value="0" oninput="scrub(+this.value)"><span id="tm">0:00 / 0:00</span></div>
</div>
<div id="pane"></div>
<div id="tabs">
 <button class="t0 on" onclick="tab(0)"><b>📁</b>MÉDIAS</button>
 <button class="t1" onclick="tab(1)"><b>✂️</b>MONTAGE</button>
 <button class="t2" onclick="tab(2)"><b>🔤</b>TITRES</button>
 <button class="t3" onclick="tab(3)"><b>🎵</b>AUDIO</button>
 <button class="t4" onclick="tab(4)"><b>📤</b>EXPORT</button>
</div>
<div id="modal"><div class="box"><h2 id="mt"></h2><div id="mb"></div><div class="row" id="mbt"></div></div></div>
<input id="fv" type="file" accept="video/*,image/*" multiple hidden>
<input id="fm" type="file" accept="audio/*" hidden>
<audio id="pa"></audio>
<script>
const $=id=>document.getElementById(id);
const S={clips:[],titles:[],music:null,voice:null,sel:-1,ratio:"16:9",res:1080,fadeMs:600,trans:"cross",duck:true,pos:0,tab:0,imgMs:4000};
const mu=u=>"/m?u="+encodeURIComponent(u);
let undo=[],redo=[],playing=false,t0=0,raf=0,curIdx=-2,job=null,jobT0=0,pollT=0,recT=0,recOn=false;
const N=window.Native||null;
function fmt(ms){ms=Math.max(0,Math.round(ms/1000));return Math.floor(ms/60)+":"+String(ms%60).padStart(2,"0")}
function fmt1(ms){return (ms/1000).toFixed(1)+" s"}
function dur(c){return c.type==="image"?c.imgMs:Math.max(200,(c.out-c.in)/(c.speed||1))}
function xOf(i){if(S.trans!=="cross"||i<=0||i>=S.clips.length)return 0;const x=Math.min(S.fadeMs,Math.min(dur(S.clips[i]),dur(S.clips[i-1]))/2-1);return x>=200?x:0}
function mainDur(i){return dur(S.clips[i])-xOf(i)}
function starts(){let t=0;return S.clips.map((c,i)=>{const s=t;t+=mainDur(i);return s})}
function total(){return S.clips.reduce((a,c,i)=>a+mainDur(i),0)}
function snap(){undo.push(JSON.stringify({c:S.clips,t:S.titles,s:S.sel}));if(undo.length>60)undo.shift();redo=[]}
function restore(j){const o=JSON.parse(j);S.clips=o.c;S.titles=o.t;S.sel=Math.min(o.s,S.clips.length-1);curIdx=-2;refresh()}
function doUndo(){if(!undo.length)return;redo.push(JSON.stringify({c:S.clips,t:S.titles,s:S.sel}));restore(undo.pop())}
function doRedo(){if(!redo.length)return;undo.push(JSON.stringify({c:S.clips,t:S.titles,s:S.sel}));restore(redo.pop())}

/* ---------- onglets ---------- */
function tab(n){S.tab=n;document.querySelectorAll("#tabs button").forEach((b,i)=>b.classList.toggle("on",i===n));render()}
function render(){const p=$("pane");const keep=p.scrollTop;p.innerHTML=[tabMedias,tabMontage,tabTitres,tabAudio,tabExport][S.tab]();p.scrollTop=keep;if(S.tab===4&&job)updJob()}
function refresh(){const sl=$("sl");sl.max=total();$("empty").style.display=S.clips.length?"none":"flex";S.pos=Math.min(S.pos,total());sl.value=S.pos;show(S.pos,true);render()}
function setRatio(){const r=S.ratio.split(":");$("pvwrap").style.aspectRatio=r[0]+"/"+r[1];$("pvwrap").style.width=(+r[0]>=+r[1]?"100%":"auto");$("pvwrap").style.height=(+r[0]>=+r[1]?"auto":"34vh")}

/* ---------- projets ---------- */
function projData(){return JSON.stringify({v:2,clips:S.clips,titles:S.titles,music:S.music,voice:S.voice,ratio:S.ratio,res:S.res,fadeMs:S.fadeMs,trans:S.trans,duck:S.duck,sel:S.sel})}
function projApply(j){const o=JSON.parse(j);stop();S.clips=(o.clips||[]).filter(c=>c.uri||c.url);S.titles=o.titles||[];S.music=o.music||null;S.voice=o.voice||null;S.ratio=o.ratio||"16:9";S.res=o.res||1080;S.fadeMs=o.fadeMs==null?600:o.fadeMs;S.trans=o.trans||"cross";S.duck=o.duck!==false;S.sel=Math.min(o.sel==null?-1:o.sel,S.clips.length-1);S.pos=0;undo=[];redo=[];curIdx=-2;
 S.clips.forEach(c=>{if(c.uri)c.url=mu(c.uri)});if(S.music&&S.music.uri){S.music.url=mu(S.music.uri)}
 if(S.music){$("pa").src=S.music.url}else{$("pa").removeAttribute("src")}setRatio();lastSaved=projData();refresh()}
let lastSaved="";
function autosave(){if(!N||!N.projSave)return;try{const d=projData();if(d!==lastSaved&&S.clips.length){N.projSave("_auto",d);lastSaved=d}}catch(_){}}
setInterval(autosave,3000);
function saveProject(){const n=($("pn").value||"").trim();if(!n){toast("Donne un nom au projet.");return}
 if(!N){toast("La sauvegarde fonctionne dans l'appli.");return}
 if(N.projSave(n,projData()))toast("Projet « "+esc(n)+" » sauvegardé.");else toast("La sauvegarde a échoué.");render()}
function loadProject(n){const j=N.projLoad(n);if(!j){toast("Projet introuvable.");return}try{projApply(j)}catch(e){toast("Ce projet est illisible.")}}
function delProject(n){modal("","Supprimer ce projet ?","« "+esc(n)+" » sera effacé. Tes photos et vidéos ne sont pas touchées.",[["ANNULER","",closeModal],["SUPPRIMER","r",()=>{N.projDelete(n);closeModal();render()}]])}
function tabProjets(){
 let list=[];try{list=JSON.parse(N.projList())}catch(_){}
 const auto=list.find(x=>x.name==="_auto"),others=list.filter(x=>x.name!=="_auto");
 const d=t=>new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
 return `<div class="card"><h3>💾 Projets</h3>
 ${auto?`<button class="btn g big" onclick="loadProject('_auto')">↩ REPRENDRE LE DERNIER MONTAGE<br><small>${d(auto.ts)}</small></button>`:""}
 <label class="f">Sauvegarder ce montage sous le nom</label><input type="text" id="pn" placeholder="Ex. Pattaya novembre">
 <div class="row"><button class="btn b" onclick="saveProject()">💾 SAUVEGARDER</button></div>
 ${others.map(x=>`<div class="item"><span>${esc(x.name)} · ${d(x.ts)}</span><button style="background:#43a047" onclick="loadProject('${x.name.replace(/'/g,"\\'")}')">↩</button><button onclick="delProject('${x.name.replace(/'/g,"\\'")}')">🗑</button></div>`).join("")}
 <div class="hint">Le montage est aussi sauvegardé tout seul toutes les quelques secondes.</div></div>`}
/* ---------- onglet MÉDIAS ---------- */
function tabMedias(){
 return `<div class="card"><h3>Ajouter</h3><div class="row"><button class="btn o big" onclick="$('fv').click()">➕ PHOTOS ET VIDÉOS</button></div>
 <div class="hint">Tu peux en choisir plusieurs d'un coup. Ils s'ajoutent à la fin du montage.</div></div>
 ${N&&N.projList?tabProjets():""}
 <div class="card"><h3>Montage (${S.clips.length} éléments, ${fmt(total())})</h3>${strip()}
 ${S.clips.length?`<div class="hint">Touche un élément puis va dans MONTAGE pour le régler.</div>`:`<div class="hint">Rien pour l'instant.</div>`}</div>`}
function strip(){const st=starts();return `<div id="strip">${S.clips.map((c,i)=>`<div class="ch ${i===S.sel?"sel":""}" onclick="selClip(${i})"><i>${i+1}</i><img src="${c.thumb||""}"><small>${c.type==="image"?"🖼 ":"🎞 "}${fmt1(dur(c))}</small></div>`).join("")}</div>`}
function selClip(i){S.sel=i;S.pos=starts()[i];$("sl").value=S.pos;show(S.pos,true);render()}
$("fv").onchange=e=>{const files=[...e.target.files];let p=[];try{p=JSON.parse(N.lastPicked())}catch(_){}
 snap();files.forEach((f,i)=>addFile(f,p[i]));e.target.value=""};
function addFile(f,info){
 const image=(f.type||"").startsWith("image");const url=(info&&info.uri)?mu(info.uri):URL.createObjectURL(f);
 const c={id:Date.now()+Math.random(),type:image?"image":"video",url,uri:info?info.uri:"",name:f.name,in:0,out:0,src:0,imgMs:S.imgMs,vol:100,speed:1,kb:image,bright:0,contrast:0,sat:0,rot:0,fade:true,thumb:""};
 S.clips.push(c);
 if(image){c.thumb=url;refresh();return}
 const v=document.createElement("video");v.preload="metadata";v.muted=true;v.src=url;
 v.onloadedmetadata=()=>{c.src=Math.round(v.duration*1000)||1000;c.out=c.src;try{v.currentTime=Math.min(0.5,v.duration/2)}catch(_){}refresh()};
 v.onseeked=()=>{try{const cv=document.createElement("canvas");cv.width=120;cv.height=68;cv.getContext("2d").drawImage(v,0,0,120,68);c.thumb=cv.toDataURL("image/jpeg",.7)}catch(_){}refresh();v.onseeked=null};
 v.onerror=()=>{c.out=c.src=3000;refresh()};
}

/* ---------- onglet MONTAGE ---------- */
function tabMontage(){
 if(!S.clips.length)return `<div class="card"><h3>Montage</h3><div class="hint">Ajoute d'abord des médias.</div></div>`;
 const c=S.clips[S.sel];
 let h=`<div class="card"><h3>Éléments</h3>${strip()}
 <div class="row"><button class="btn" onclick="mv(-1)">◀ AVANT</button><button class="btn" onclick="mv(1)">APRÈS ▶</button></div>
 <div class="row"><button class="btn b" onclick="splitAt()">✂️ COUPER ICI</button><button class="btn" onclick="dupClip()">⧉ DOUBLER</button><button class="btn r" onclick="delClip()">🗑</button></div>
 <div class="row"><button class="btn" onclick="doUndo()" ${undo.length?"":"disabled"}>↶ ANNULER</button><button class="btn" onclick="doRedo()" ${redo.length?"":"disabled"}>↷ RÉTABLIR</button></div></div>`;
 if(!c)return h+`<div class="card"><div class="hint">Touche un élément pour le régler.</div></div>`;
 h+=`<div class="card"><h3>Élément ${S.sel+1} : ${c.type==="image"?"photo":"vidéo"}</h3>`;
 if(c.type==="video"){
  h+=`<label class="f">Début <span id="v_in">${fmt1(c.in)}</span></label><input type="range" min="0" max="${Math.max(0,c.src-200)}" value="${c.in}" oninput="setIn(+this.value)" onchange="commit()">
  <label class="f">Fin <span id="v_out">${fmt1(c.out)}</span></label><input type="range" min="200" max="${c.src}" value="${c.out}" oninput="setOut(+this.value)" onchange="commit()">`;
 }else{
  h+=`<label class="f">Durée d'affichage <span id="v_img">${fmt1(c.imgMs)}</span></label><input type="range" min="1000" max="15000" step="500" value="${c.imgMs}" oninput="setImg(+this.value)" onchange="commit()">`;
 }
 h+=`${c.type==="video"?`<label class="f">Vitesse <span id="v_speed">×${c.speed||1}</span></label><input type="range" min="0.25" max="4" step="0.05" value="${c.speed||1}" oninput="setSpeed(+this.value)" onchange="commit()">
 <label class="f">Volume <span id="v_vol">${c.vol} %</span></label><input type="range" min="0" max="200" value="${c.vol}" oninput="setP('vol',+this.value,' %')" onchange="commit()">`:""}
 <label class="f">Luminosité <span id="v_bright">${c.bright}</span></label><input type="range" min="-50" max="50" value="${c.bright}" oninput="setP('bright',+this.value,'')" onchange="commit()">
 <label class="f">Contraste <span id="v_contrast">${c.contrast}</span></label><input type="range" min="-50" max="50" value="${c.contrast}" oninput="setP('contrast',+this.value,'')" onchange="commit()">
 <label class="f">Saturation <span id="v_sat">${c.sat}</span></label><input type="range" min="-100" max="100" value="${c.sat}" oninput="setP('sat',+this.value,'')" onchange="commit()">
 <div class="row"><button class="btn" onclick="rotClip(-90)">⟲ 90°</button><button class="btn" onclick="rotClip(90)">⟳ 90°</button><button class="btn ${c.fade?"g":""}" onclick="togFade()">${c.fade?"✔ FONDU":"FONDU"}</button></div>
 ${c.type==="image"?`<div class="row"><button class="btn ${c.kb?"g":""}" onclick="togKb()">${c.kb?"✔ ZOOM LENT":"ZOOM LENT"}</button></div>`:""}</div>`;
 return h}
function curC(){return S.clips[S.sel]}
function setIn(v){const c=curC();c.in=Math.min(v,c.out-200);$("v_in").textContent=fmt1(c.in);S.pos=starts()[S.sel];refreshLight()}
function setOut(v){const c=curC();c.out=Math.max(v,c.in+200);$("v_out").textContent=fmt1(c.out);refreshLight()}
function setSpeed(v){const c=curC();c.speed=v;$("v_speed").textContent="×"+v;refreshLight()}
function togKb(){const c=curC();if(!c)return;snap();c.kb=!c.kb;render();show(S.pos,true)}
function setImg(v){const c=curC();c.imgMs=v;$("v_img").textContent=fmt1(v);refreshLight()}
function setP(k,v,u){const c=curC();c[k]=v;$("v_"+k).textContent=v+u;show(S.pos,true)}
function refreshLight(){$("sl").max=total();show(S.pos,true)}
function commit(){render()}
function mv(d){const i=S.sel,j=i+d;if(i<0||j<0||j>=S.clips.length)return;snap();[S.clips[i],S.clips[j]]=[S.clips[j],S.clips[i]];S.sel=j;refresh()}
function dupClip(){if(S.sel<0)return;snap();const c=JSON.parse(JSON.stringify(S.clips[S.sel]));c.id=Date.now()+Math.random();S.clips.splice(S.sel+1,0,c);S.sel++;refresh()}
function delClip(){if(S.sel<0)return;snap();S.clips.splice(S.sel,1);S.sel=Math.min(S.sel,S.clips.length-1);refresh()}
function rotClip(d){const c=curC();if(!c)return;snap();c.rot=((c.rot+d)%360+360)%360;show(S.pos,true);render()}
function togFade(){const c=curC();if(!c)return;snap();c.fade=!c.fade;render()}
function splitAt(){
 const st=starts();let i=S.sel;
 for(let k=0;k<S.clips.length;k++){if(S.pos>=st[k]&&S.pos<st[k]+dur(S.clips[k])){i=k;break}}
 if(i<0)return;const c=S.clips[i],x=xOf(i),local=Math.round(S.pos-st[i])+x,whole=dur(c);
 if(local<300||local>whole-300){toast("Place le curseur au milieu de l'élément.");return}
 snap();const d=JSON.parse(JSON.stringify(c));d.id=Date.now()+Math.random();
 if(c.type==="image"){c.imgMs=Math.round(local);d.imgMs=Math.round(whole-local)}
 else{const cut=Math.round(c.in+local*(c.speed||1));d.in=cut;c.out=cut}
 S.clips.splice(i+1,0,d);S.sel=i;refresh()}
function toast(t){modal("",t,"",[["OK","g",closeModal]])}

/* ---------- onglet TITRES ---------- */
const COLS={"Blanc":"#FFFFFF","Jaune":"#FFD600","Rouge":"#FF5252","Vert":"#69F0AE","Noir":"#000000"};
const SIZES={"Petit":.045,"Moyen":.07,"Grand":.10,"Très grand":.14};
function tabTitres(){
 return `<div class="card"><h3>Nouveau titre</h3><input type="text" id="tt" placeholder="Texte du titre">
 <label class="f">Position</label><select id="tp"><option value="2">En bas</option><option value="1">Au centre</option><option value="0">En haut</option></select>
 <label class="f">Taille</label><select id="ts">${Object.keys(SIZES).map(k=>`<option ${k==="Moyen"?"selected":""}>${k}</option>`).join("")}</select>
 <label class="f">Couleur</label><select id="tc">${Object.keys(COLS).map(k=>`<option>${k}</option>`).join("")}</select>
 <label class="f">Durée d'affichage <span id="v_td">3 s</span></label><input type="range" id="td" min="1" max="15" value="3" oninput="$('v_td').textContent=this.value+' s'">
 <div class="hint">Le titre apparaît à partir de l'endroit où tu as placé le curseur (${fmt(S.pos)}).</div>
 <button class="btn p big" onclick="addTitle()">➕ AJOUTER LE TITRE</button></div>

/* ---------- rythme de la musique ---------- */
async function analyseBeats(url){
 const buf=await (await fetch(url)).arrayBuffer();
 const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();const ab=await ctx.decodeAudioData(buf);try{ctx.close()}catch(_){}
 const ch=ab.getChannelData(0),sr=ab.sampleRate,hop=Math.round(sr*0.01),n=Math.floor(ch.length/hop);
 const env=new Float32Array(n);
 for(let i=0;i<n;i++){let e=0;const o=i*hop;for(let j=0;j<hop;j++){const v=ch[o+j];e+=v*v}env[i]=Math.sqrt(e/hop)}
 const on=new Float32Array(n);for(let i=1;i<n;i++){on[i]=Math.max(0,env[i]-env[i-1])}
 // moyenne glissante retiree (garde les vrais sursauts)
 const w=20;let acc=0;const loc=new Float32Array(n);for(let i=0;i<n;i++){acc+=on[i];if(i>=w)acc-=on[i-w];loc[i]=Math.max(0,on[i]-acc/w*1.2)}
 let best=-1,bestL=50;
 for(let L=33;L<=100;L++){let sc=0;for(let i=0;i+L<n;i++)sc+=loc[i]*loc[i+L];
  // favorise 80-140 BPM (lag 43-75)
  const bpm=6000/L,wgt=(bpm>=80&&bpm<=140)?1.15:1;sc*=wgt;if(sc>best){best=sc;bestL=L}}
 let bo=0,bs=-1;for(let o=0;o<bestL;o++){let sc=0;for(let i=o;i<n;i+=bestL)sc+=loc[i];if(sc>bs){bs=sc;bo=o}}
 return {bpm:Math.round(6000/bestL),beatMs:bestL*10,first:bo*10,durMs:ab.duration*1000}}
async function autoRhythm(){
 const msg=$("rhmsg");if(!S.music||!S.clips.length)return;
 msg.textContent="Écoute de la musique…";
 let r;try{r=await analyseBeats(S.music.url)}catch(e){msg.textContent="Impossible de lire cette musique.";return}
 const mode=S.rk||"auto",mult={"à chaque temps":1,"tous les 2 temps":2,"tous les 4 temps":4,"tous les 8 temps":8}[mode];
 const N=S.clips.length;let k=mult;
 if(!k){const target=r.durMs/N;k=Math.max(1,Math.round(target/r.beatMs));k=[1,2,4,8].reduce((a,b)=>Math.abs(b-k)<Math.abs(a-k)?b:a,1)}
 while(k*r.beatMs<1500&&k<16)k*=2;
 snap();const len=k*r.beatMs;
 S.clips.forEach((c,i)=>{
  // duree utile dans le montage : un multiple de temps ; les coupes tombent sur les temps
  let want=len+(i===0?Math.min(r.first,len):0);
  const x=(S.trans==="cross"&&i>0)?Math.min(S.fadeMs,want/2-1):0;want+=(x>=200?x:0);
  if(c.type==="image"){c.imgMs=Math.round(want)}
  else{const sp=c.speed||1,need=want*sp;
   if(c.src>=need){const slack=c.src-need;c.in=Math.round(slack*0.25);c.out=Math.round(c.in+need)}
   else{c.in=0;c.out=c.src}}});
 refresh();
 msg.textContent="Rythme détecté : "+r.bpm+" battements par minute, un changement tous les "+k+" temps ("+(len/1000).toFixed(1)+" s). Montage : "+fmt(total())+" pour "+fmt(r.durMs)+" de musique."}
/* ---------- aperçu ---------- */
function show(pos,seek){
 const st=starts(),n=S.clips.length;const pv=$("pv"),pi=$("pi");
 let i=-1;for(let k=0;k<n;k++){if(pos>=st[k]&&(pos<st[k]+dur(S.clips[k])||k===n-1)){i=k;break}}
 $("tm").textContent=fmt(pos)+" / "+fmt(total());if(!playing)$("sl").value=pos;
 let tt="";const hv=$("pvwrap").clientHeight||200;
 S.titles.forEach(t=>{if(pos>=t.from&&pos<=t.to){const el=$("tov");el.style.color=t.color;el.style.fontSize=(t.size*hv)+"px";el.style.top=t.pos===0?"6%":(t.pos===1?"40%":"");el.style.bottom=t.pos===2?"6%":"";tt=t.text}});
 $("tov").textContent=tt;if(!tt){$("tov").style.top="";$("tov").style.bottom=""}
 if(i<0){pv.removeAttribute("src");pv.style.display="none";pi.style.display="none";curIdx=-2;return}
 const c=S.clips[i],local=pos-st[i]+xOf(i);
 const filt=`brightness(${1+c.bright/100}) contrast(${1+c.contrast/100}) saturate(${1+c.sat/100})`;
 const tr=`rotate(${c.rot}deg)`;
 let f=0;if(S.trans==="dip"&&S.fadeMs>0&&c.fade){const d=dur(c),fm=Math.min(S.fadeMs,d/2);if(local<fm)f=1-local/fm;if(local>d-fm)f=Math.max(f,(local-(d-fm))/fm)}
 $("fadev").style.opacity=Math.max(0,Math.min(1,f));
 if(c.type==="image"){pv.pause();pv.style.display="none";pi.style.display="block";if(pi.getAttribute("src")!==c.url)pi.src=c.url;pi.style.filter=filt;const kp=Math.max(0,Math.min(1,local/dur(c)));pi.style.transform=tr+(c.kb?" scale("+(1+0.18*(i%2===0?kp:1-kp))+")":"")}
 else{pi.style.display="none";pv.style.display="block";pv.style.filter=filt;pv.style.transform=tr;pv.volume=Math.min(1,c.vol/100);
  pv.playbackRate=c.speed||1;const want=(c.in+local*(c.speed||1))/1000;
  if(curIdx!==i||pv.getAttribute("data-u")!==c.url){curIdx=i;pv.setAttribute("data-u",c.url);pv.src=c.url;pv.onloadedmetadata=()=>{try{pv.currentTime=want}catch(_){}if(playing)pv.play().catch(()=>{})}}
  else if(seek||Math.abs(pv.currentTime-want)>0.6){try{pv.currentTime=want}catch(_){}}
  if(playing&&pv.paused)pv.play().catch(()=>{});if(!playing)pv.pause()}
 curIdx=i}
function scrub(v){S.pos=v;if(playing)t0=performance.now()-v;show(v,true);const pa=$("pa");if(S.music&&playing){try{pa.currentTime=(v/1000)%(pa.duration||1e9)}catch(_){}}}
function togglePlay(){if(!S.clips.length)return;playing?stop():play()}
function play(){if(S.pos>=total()-50)S.pos=0;playing=true;t0=performance.now()-S.pos;$("bplay").textContent="⏸";curIdx=-2;
 if(S.music){try{$("pa").currentTime=(S.pos/1000)%($("pa").duration||1e9)}catch(_){}$("pa").loop=true;$("pa").volume=Math.min(1,S.music.vol/100);$("pa").play().catch(()=>{})}
 const loop=()=>{if(!playing)return;S.pos=performance.now()-t0;if(S.pos>=total()){S.pos=total();stop();show(S.pos,false);return}$("sl").value=S.pos;show(S.pos,false);raf=requestAnimationFrame(loop)};loop()}
function stop(){playing=false;cancelAnimationFrame(raf);$("bplay").textContent="▶";$("pv").pause();$("pa").pause()}

/* ---------- onglet EXPORT ---------- */
function outSize(){const sh=S.res,r=S.ratio.split(":").map(Number);let w,h;
 if(r[0]>=r[1]){h=sh;w=Math.round(sh*r[0]/r[1])}else{w=sh;h=Math.round(sh*r[1]/r[0])}
 return {w:w-(w%2),h:h-(h%2)}}
function tabExport(){const sz=outSize();
 return `<div class="card"><h3>Format de la vidéo</h3>
 <label class="f">Format</label><select onchange="S.ratio=this.value;setRatio();render();show(S.pos,true)">${[["16:9","Paysage 16:9 (YouTube, TV)"],["9:16","Vertical 9:16 (Reels, TikTok, Story)"],["1:1","Carré 1:1 (Instagram)"],["4:5","Portrait 4:5 (Instagram)"],["4:3","Classique 4:3"]].map(a=>`<option value="${a[0]}" ${S.ratio===a[0]?"selected":""}>${a[1]}</option>`).join("")}</select>
 <label class="f">Qualité</label><select onchange="S.res=+this.value;render()">${[[720,"HD 720p (léger)"],[1080,"Full HD 1080p (conseillé)"],[2160,"Ultra HD 4K (lourd)"]].map(a=>`<option value="${a[0]}" ${S.res===a[0]?"selected":""}>${a[1]}</option>`).join("")}</select>
 <label class="f">Transition entre les éléments</label><select onchange="S.trans=this.value;refresh()">${[["cross","Fondu enchaîné (les deux images se mélangent)"],["dip","Fondu au noir"],["none","Aucune (coupe franche)"]].map(a=>`<option value="${a[0]}" ${S.trans===a[0]?"selected":""}>${a[1]}</option>`).join("")}</select>
 <label class="f">Durée du fondu <span id="v_fd">${(S.fadeMs/1000).toFixed(1)} s</span></label><input type="range" min="0" max="2000" step="100" value="${S.fadeMs}" oninput="S.fadeMs=+this.value;$('v_fd').textContent=(this.value/1000).toFixed(1)+' s'" onchange="refresh()">
 <div class="hint">Résultat : ${sz.w} × ${sz.h}, ${fmt(total())}. Enregistré dans Films / MONTAGE.<br>L'aperçu montre les coupes sans le mélange des images : le fondu enchaîné est appliqué à l'export. L'export continue même si tu quittes l'appli.</div></div>
 <button class="btn r big" id="bgo" onclick="startExport()" ${job&&job.run?"disabled":""}>🚀 EXPORTER LA VIDÉO</button>
 <div class="card" style="margin-top:10px" id="prog">
 <div class="hgw"><div class="hgflip" id="hgflip">${hgSVG()}</div><div class="hgr"><div class="hgp" id="ptxt">0 %</div>
 <div class="clocks"><span>⏱ ÉCOULÉ <span id="cEl">00:00</span></span><span>⌛ RESTE <span id="cLeft">--:--</span></span></div></div></div>
 <div class="bar"><i id="barfill"></i></div>
 <div class="banner" id="banner">PRÊT</div><div class="msg" id="pmsg"></div>
 <div class="row"><button class="btn r" id="bstop" style="flex:1" onclick="stopExport()" disabled>⏹ ARRÊTER</button></div></div>`}
function startExport(){
 if(!S.clips.length){toast("Ajoute d'abord des photos ou des vidéos.");return}
 if(S.clips.some(c=>!c.uri)){toast("Un élément n'a pas son fichier d'origine. Retire-le et ajoute-le de nouveau.");return}
 if(!N){toast("L'export fonctionne dans l'appli Android.");return}
 stop();const sz=outSize();
 const spec={w:sz.w,h:sz.h,fadeMs:S.fadeMs,trans:S.trans,
  clips:S.clips.map(c=>({uri:c.uri,type:c.type,in:c.in,out:c.out,imgMs:c.imgMs,vol:c.vol,bright:c.bright,contrast:c.contrast,sat:c.sat,rot:c.rot,fade:c.fade,speed:c.speed||1,kb:!!c.kb})),
  titles:S.titles.map(t=>({text:t.text,from:t.from,to:t.to,pos:t.pos,size:t.size,color:t.color})),
  duck:S.duck};
 if(S.music&&S.music.uri)spec.music={uri:S.music.uri,vol:S.music.vol};
 if(S.voice)spec.voice={path:S.voice.path,startMs:S.voice.startMs,vol:S.voice.vol};
 job={run:true,pct:0};jobT0=Date.now();N.exportStart(JSON.stringify(spec));
 clearInterval(pollT);pollT=setInterval(pollJob,400);render();$("prog").scrollIntoView({behavior:"smooth",block:"center"})}
function stopExport(){if(N)N.exportCancel()}
function pollJob(){if(!N||!job)return;const st=N.exportState();job.pct=N.exportProgress();
 if(st===2){clearInterval(pollT);job.run=false;job.done=true;job.res=N.exportResult();updJob();finishUp(true)}
 else if(st===3){clearInterval(pollT);job.run=false;job.err=N.exportError();updJob();finishUp(false)}
 else updJob()}
function updJob(){if(!$("prog")||!job)return;const p=job.pct||0;
 hgSet(job.done?100:p,job.run);$("barfill").style.width=(job.done?100:p)+"%";
 const el=(Date.now()-jobT0)/1000;$("cEl").textContent=clk(el);
 $("cLeft").textContent=job.done?"00:00":(p>3?clk(el*(100-p)/p):"--:--");
 $("bgo").disabled=!!job.run;$("bstop").disabled=!job.run;
 const b=$("banner");
 if(job.run){b.className="banner run";b.textContent="EN COURS…"}
 else if(job.done){b.className="banner done";b.textContent="TERMINÉ"}
 else if(job.err==="annulé"){b.className="banner stop";b.textContent="ARRÊTÉ"}
 else{b.className="banner err";b.textContent="ERREUR"}
 $("pmsg").textContent=job.run?"Garde l'écran allumé pendant l'export.":(job.err&&job.err!=="annulé"?job.err:"")}
function clk(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[880,1175,1568].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);const t=a.currentTime+i*.18;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.start(t);o.stop(t+.17)})}catch(_){}}
function finishUp(ok){
 if(ok){beep();if(N)N.buzz();const f=$("hgflip");if(f){f.classList.remove("fin");void f.offsetWidth;f.classList.add("fin")}
  modal("ok","✔ TERMINÉ","Ta vidéo est dans <b>Films / MONTAGE</b>.<br>Durée : "+fmt(total())+"<br>Temps d'export : "+clk((Date.now()-jobT0)/1000),[["▶ VOIR LA VIDÉO","g",()=>{closeModal();N.viewVideo(job.res)}],["FERMER","",closeModal]])}
 else if(job.err!=="annulé")modal("err","ERREUR","L'export a échoué.<br><small>"+esc(job.err)+"</small>",[["FERMER","",closeModal]])}

function hgCol(p){const a=[[0,[229,57,53]],[.45,[251,140,0]],[.75,[253,216,53]],[1,[67,160,71]]];for(let i=1;i<a.length;i++)if(p<=a[i][0]){const x=a[i-1],y=a[i],k=(p-x[0])/(y[0]-x[0]);return"rgb("+x[1].map((v,j)=>Math.round(v+(y[1][j]-v)*k)).join(",")+")"}return"rgb(67,160,71)"}
